name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  awesome-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 is required for awesome-lint
          # to check the repository age/history
          fetch-depth: 0

      - name: Run awesome-lint
        run: npx awesome-lint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
